<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CSDM bridge skeleton</title>
<style>
  /* Deliberately minimal: this proves the transport, not the interface (chantier 3/4). */
  body {
    margin: 0;
    background: #111;
    color: #ddd;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 13px;
  }
  #toolbar {
    padding: 8px;
    border-bottom: 1px solid #333;
  }
  #toolbar button {
    margin-right: 8px;
  }
  #ask-panel {
    padding: 8px;
    border-bottom: 1px solid #333;
    display: none;
  }
  #ask-panel button {
    margin-right: 8px;
  }
  #log {
    white-space: pre-wrap;
    padding: 8px;
    overflow-y: auto;
    height: calc(100vh - 100px);
  }
  .line-err { color: #f66; }
  .line-warn { color: #fc6; }
  .line-ok { color: #6f6; }
  .line-dim { color: #888; }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-ping">ping</button>
    <button id="btn-demo-logs">demo_logs</button>
    <button id="btn-demo-ask">demo_ask</button>
  </div>
  <div id="ask-panel"></div>
  <div id="log"></div>

  <script>
    const logEl = document.getElementById("log");
    const askPanel = document.getElementById("ask-panel");
    let commandCounter = 0;

    function appendLine(text, cssClass) {
      const div = document.createElement("div");
      if (cssClass) div.className = cssClass;
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function levelClass(level) {
      if (level === "err") return "line-err";
      if (level === "warn") return "line-warn";
      if (level === "ok") return "line-ok";
      if (level === "dim") return "line-dim";
      return "";
    }

    function sendCommand(name) {
      commandCounter += 1;
      window.bridge.send({ type: "command", id: String(commandCounter), name });
    }

    document.getElementById("btn-ping").addEventListener("click", () => sendCommand("ping"));
    document.getElementById("btn-demo-logs").addEventListener("click", () => sendCommand("demo_logs"));
    document.getElementById("btn-demo-ask").addEventListener("click", () => sendCommand("demo_ask"));

    window.bridge.onMessage((message) => {
      switch (message.type) {
        case "log":
          appendLine(`[log:${message.level || "-"}] ${message.message}`, levelClass(message.level));
          break;
        case "log_parts": {
          const text = message.parts.map(([t]) => t).join("");
          appendLine(`[log_parts] ${text}`);
          break;
        }
        case "state":
          appendLine(`[state] ${message.name} ${JSON.stringify(message.payload)}`, "line-dim");
          break;
        case "ask":
          appendLine(`[ask:${message.kind}] ${message.message}`);
          showAsk(message);
          break;
        case "result":
          appendLine(`[result] id=${message.id} ok=${message.ok}${message.error ? " error=" + message.error : ""}`);
          break;
        case "fatal":
          appendLine(`[fatal] ${message.error}`, "line-err");
          break;
        case "child_exit":
          appendLine(`[bridge] python engine exited (code=${message.code}, signal=${message.signal})`, "line-err");
          break;
        case "child_error":
          appendLine(`[bridge] failed to start python engine: ${message.error}`, "line-err");
          break;
        default:
          appendLine(`[unknown] ${JSON.stringify(message)}`, "line-dim");
      }
    });

    function showAsk(question) {
      askPanel.innerHTML = "";
      askPanel.style.display = "block";
      const title = document.createElement("span");
      title.textContent = (question.options && question.options[0] ? question.options[0] : question.message) + "  ";
      askPanel.appendChild(title);

      const choices = (question.options || []).slice(1);
      choices.forEach((choice) => {
        const btn = document.createElement("button");
        btn.textContent = choice;
        btn.addEventListener("click", () => {
          window.bridge.send({ type: "answer", id: question.id, value: choice });
          askPanel.style.display = "none";
          askPanel.innerHTML = "";
        });
        askPanel.appendChild(btn);
      });
    }
  </script>
</body>
</html>
