[package]
name = "csdm-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
csdm-core = { workspace = true }
csdm-db = { workspace = true }
csdm-demo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
# Local time, as 3.5 `datetime.fromtimestamp` (demo dates, date filter bounds).
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
# The batch run (T4): job files, concat lists.
tempfile = { workspace = true }
# Job objects, process snapshots, the CS2 window watcher (T4). Already in the lock through egui/wgpu.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
sha2 = { workspace = true }

# Test stand-in for CS Demo Manager's CLI, CS2 and FFmpeg (tests/process.rs). Never shipped.
[[bin]]
name = "csdm_fake_tool"
path = "tests/support/fake_tool.rs"
test = false
doc = false
