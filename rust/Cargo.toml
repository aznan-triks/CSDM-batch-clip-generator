# CSDM Batch Clips Generator 5.x -- native Rust rewrite (branch v5).
# Crate layers and the dependencies each may take: csdm-app/tests/layers.rs.
[workspace]
resolver = "2"
members = ["csdm-core", "csdm-db", "csdm-demo", "csdm-engine", "csdm-app"]
# Vendored demo parser (vendor/VENDOR.md): a path dependency of csdm-demo, never a member, so
# `cargo clippy --workspace` and `cargo test --workspace` leave the upstream code alone.
exclude = ["vendor"]

[workspace.package]
version = "5.0.0-dev"
edition = "2021"
license = "Unlicense"
publish = false

[workspace.dependencies]
csdm-core = { path = "csdm-core" }
csdm-db = { path = "csdm-db" }
csdm-demo = { path = "csdm-demo" }
csdm-engine = { path = "csdm-engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
sha2 = "0.11.1"
indexmap = "2.14.2"

# Same release profile as the measured prototypes (.scratch proto/Cargo.toml, ticket 06).
# Never set `panic = "abort"`: csdm-demo turns a parser panic into an error with catch_unwind.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 16
